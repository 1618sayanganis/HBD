<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday @Maulidiffa 🎉</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #1b0c2e 0%, #060111 100%);
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.2rem 1.5rem;
    }
    .header-badge {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 0.65rem 1.8rem;
      border-radius: 999px;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: #ff9ec7;
      box-shadow: 0 8px 32px rgba(255, 105, 180, 0.25);
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    .instruction {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: auto;
    }
    .controls {
      display: flex;
      gap: 12px;
      pointer-events: auto;
      margin-bottom: 0.6rem;
    }
    .btn {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.6);
    }
    .btn:active {
      transform: translateY(1px);
    }
    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 15px rgba(255, 110, 180, 0.3);
      }
      100% {
        box-shadow: 0 0 32px rgba(255, 110, 240, 0.85);
      }
    }
  </style>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- Three.js + Helpers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <div class="header-badge">✨ Special Birthday Celebration ✨</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div class="controls">
        <button class="btn" id="confettiBtn">🎉 Letupkan Konfeti</button>
        <button class="btn" id="balloonBtn" style="background: linear-gradient(135deg, #a855f7, #6366f1); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);">🎈 Balon Tambahan</button>
      </div>
      <div class="instruction">💡 Geser / drag untuk memutar tampilan 3D • Scroll untuk zoom</div>
    </div>
  </div>

  <script>
    // --- 1. Scene, Camera, Renderer Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0c041c, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 55;
    controls.minDistance = 10;
    controls.maxPolarAngle = Math.PI / 1.7;

    // --- 2. Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xff77bb, 1.5);
    dirLight1.position.set(20, 25, 20);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x00f0ff, 1.3);
    dirLight2.position.set(-20, 15, -10);
    scene.add(dirLight2);

    const pointLight = new THREE.PointLight(0xffd700, 2, 45);
    pointLight.position.set(0, 0, 15);
    scene.add(pointLight);

    // --- 3. Text Loader & 3D Typography ---
    const fontLoader = new THREE.FontLoader();
    const textGroup = new THREE.Group();
    scene.add(textGroup);

    fontLoader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      createTypography(font);
    });

    function createTypography(font) {
      const lines = [
        {
          text: "Happy Birthday",
          size: 2.2,
          height: 0.6,
          y: 4.0,
          color: 0xff3b77,
          emissive: 0x4a001f
        },
        {
          text: "@Maulidiffa",
          size: 3.0,
          height: 0.85,
          y: 0.3,
          color: 0xffc837,
          emissive: 0x5a3e00
        },
        {
          text: "wish you all the best!",
          size: 1.4,
          height: 0.4,
          y: -3.0,
          color: 0x00f2fe,
          emissive: 0x002c38
        }
      ];

      lines.forEach((item) => {
        const textGeo = new THREE.TextGeometry(item.text, {
          font: font,
          size: item.size,
          height: item.height,
          curveSegments: 16,
          bevelEnabled: true,
          bevelThickness: 0.1,
          bevelSize: 0.05,
          bevelOffset: 0,
          bevelSegments: 5
        });

        textGeo.computeBoundingBox();
        const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);

        const material = new THREE.MeshStandardMaterial({
          color: item.color,
          emissive: item.emissive,
          roughness: 0.25,
          metalness: 0.75,
        });

        const textMesh = new THREE.Mesh(textGeo, material);
        textMesh.position.x = centerOffset;
        textMesh.position.y = item.y;
        textMesh.position.z = 0;
        textMesh.castShadow = true;
        textGroup.add(textMesh);
      });
    }

    // --- 4. Floating Particles (Sparkles / Stars) ---
    const particleCount = 650;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleColors = new Float32Array(particleCount * 3);

    const palette = [
      new THREE.Color(0xff4081),
      new THREE.Color(0xffd700),
      new THREE.Color(0x00e5ff),
      new THREE.Color(0xa855f7),
      new THREE.Color(0xffffff)
    ];

    for (let i = 0; i < particleCount; i++) {
      particlePositions[i * 3] = (Math.random() - 0.5) * 85;
      particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 65;
      particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 60;

      const col = palette[Math.floor(Math.random() * palette.length)];
      particleColors[i * 3] = col.r;
      particleColors[i * 3 + 1] = col.g;
      particleColors[i * 3 + 2] = col.b;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.35,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // --- 5. Floating 3D Balloons ---
    const balloonGroup = new THREE.Group();
    scene.add(balloonGroup);

    const balloonGeometry = new THREE.SphereGeometry(1, 32, 24);
    balloonGeometry.scale(1, 1.25, 1);

    const balloonColors = [0xff3366, 0xffbb00, 0x00d2ff, 0x9b51e0, 0x00f2fe, 0xff758c];
    const balloons = [];

    function createBalloon(x, y, z) {
      const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
      const mat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.2,
        metalness: 0.15,
        transparent: true,
        opacity: 0.92
      });

      const balloon = new THREE.Mesh(balloonGeometry, mat);
      const scale = 0.8 + Math.random() * 0.7;
      balloon.scale.set(scale, scale * 1.25, scale);
      balloon.position.set(x, y, z);

      // String line
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -scale * 1.2, 0),
        new THREE.Vector3(0, -scale * 3.2, 0)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
      const stringMesh = new THREE.Line(lineGeo, lineMat);
      balloon.add(stringMesh);

      balloon.userData = {
        speedY: 0.02 + Math.random() * 0.03,
        amplitude: 0.4 + Math.random() * 0.5,
        freq: 1 + Math.random() * 2,
        initialX: x,
        initialZ: z
      };

      balloonGroup.add(balloon);
      balloons.push(balloon);
    }

    for (let i = 0; i < 22; i++) {
      const x = (Math.random() - 0.5) * 45;
      const y = -15 + Math.random() * 30;
      const z = -12 + (Math.random() - 0.5) * 25;
      createBalloon(x, y, z);
    }

    // --- 6. Floating Stars / Diamonds ---
    const starsGroup = new THREE.Group();
    scene.add(starsGroup);

    const starShape = new THREE.OctahedronGeometry(0.7, 0);
    const starMaterial = new THREE.MeshStandardMaterial({
      color: 0xffe066,
      emissive: 0x3d3000,
      metalness: 0.85,
      roughness: 0.2
    });

    const floatingStars = [];
    for (let i = 0; i < 24; i++) {
      const star = new THREE.Mesh(starShape, starMaterial);
      star.position.set(
        (Math.random() - 0.5) * 36,
        (Math.random() - 0.5) * 22,
        (Math.random() - 0.5) * 20
      );
      starsGroup.add(star);
      floatingStars.push(star);
    }

    // --- 7. Confetti Interaction ---
    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 80,
          origin: { y: 0.65 }
        });
        setTimeout(() => {
          confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 } });
          confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 } });
        }, 200);
      }
    }

    document.getElementById('confettiBtn').addEventListener('click', triggerConfetti);
    document.getElementById('balloonBtn').addEventListener('click', () => {
      for (let i = 0; i < 8; i++) {
        const x = (Math.random() - 0.5) * 32;
        const y = -18;
        const z = (Math.random() - 0.5) * 20;
        createBalloon(x, y, z);
      }
      triggerConfetti();
    });

    // Auto fire confetti after load
    setTimeout(triggerConfetti, 800);

    // --- 8. Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Floating wave animation on 3D text
      if (textGroup) {
        textGroup.rotation.y = Math.sin(elapsedTime * 0.7) * 0.08;
        textGroup.rotation.x = Math.cos(elapsedTime * 0.5) * 0.04;
        textGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.35;
      }

      // Sparkles rotation
      particles.rotation.y = elapsedTime * 0.02;
      particles.rotation.x = elapsedTime * 0.01;

      // Balloons floating upwards
      balloons.forEach((b) => {
        b.position.y += b.userData.speedY;
        b.position.x = b.userData.initialX + Math.sin(elapsedTime * b.userData.freq) * b.userData.amplitude;
        b.position.z = b.userData.initialZ + Math.cos(elapsedTime * b.userData.freq) * (b.userData.amplitude * 0.5);
        b.rotation.y += 0.01;

        if (b.position.y > 22) {
          b.position.y = -20;
        }
      });

      // Rotating decorative diamonds
      floatingStars.forEach((star, idx) => {
        star.rotation.x += 0.015;
        star.rotation.y += 0.02;
        star.position.y += Math.sin(elapsedTime * 2 + idx) * 0.008;
      });

      // Orbiting dynamic point light
      pointLight.position.x = Math.sin(elapsedTime * 1.2) * 14;
      pointLight.position.z = Math.cos(elapsedTime * 1.2) * 12 + 6;
      pointLight.position.y = Math.sin(elapsedTime * 0.8) * 5;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- 9. Window Resize Event ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
